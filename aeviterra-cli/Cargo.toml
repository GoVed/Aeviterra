[package]
name = "aeviterra-cli"
version = "0.1.0"
edition = "2024"
description = "Client terminal interface and reference deterministic simulation engine for the Aeviterra protocol."
license = "MIT OR Apache-2.0"
keywords = ["mmo", "simulation", "cli", "aeviterra"]
categories = ["command-line-utilities", "games"]

[dependencies]
aeviterra-core = { path = "../aeviterra-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
