[package]
name = "aeviterra-core"
version = "0.1.0"
edition = "2024"
description = "Deterministic state machine, cryptographic consensus, and physical invariants for the Aeviterra century-scale virtual world."
license = "MIT OR Apache-2.0"
keywords = ["mmo", "bft", "deterministic", "sparse-merkle-tree", "consensus"]
categories = ["cryptography", "game-development", "network-programming"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
